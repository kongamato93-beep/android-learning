plugins {
    id 'com.android.application'
}

// AI 的两种走法都不把密钥写在源码里：
//   直连模式：local.properties 的 ZHIPU_API_KEY   → BuildConfig.ZHIPU_API_KEY
//   中转模式：local.properties 的 AI_PROXY_URL / AI_PROXY_TOKEN → 同名 BuildConfig 字段
// 该文件已在根目录 .gitignore 中被忽略，不会被提交。
// 注意：推荐走中转模式。直连会把密钥编进 dex（反编译可读），只留作本地调试备选。
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def zhipuApiKey = (localProps.getProperty('ZHIPU_API_KEY', '') ?: '').trim()
def aiProxyUrl = (localProps.getProperty('AI_PROXY_URL', '') ?: '').trim()
def aiProxyToken = (localProps.getProperty('AI_PROXY_TOKEN', '') ?: '').trim()

android {
    namespace 'com.example.wechat'
    compileSdk 36

    // AGP 8 起 BuildConfig 默认不生成，S1 要靠它把密钥带进 App
    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "com.example.wechat"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        // 直连模式用：值为空字符串表示「未配置」
        buildConfigField "String", "ZHIPU_API_KEY", "\"" + zhipuApiKey + "\""

        // 中转模式用：服务端地址与访问令牌。
        // 令牌只用来证明「这个请求是我自己的 App 发的」，里面没有任何厂商密钥。
        buildConfigField "String", "AI_PROXY_URL", "\"" + aiProxyUrl + "\""
        buildConfigField "String", "AI_PROXY_TOKEN", "\"" + aiProxyToken + "\""

        // Room 会把每个数据库版本的建表语句导出成 JSON，
        // 将来写 Migration 时直接对着这份 schema 写 SQL，不用凭记忆拼
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.fragment:fragment:1.8.5'

    // 本地持久化：聊天记录 / 会话状态落 SQLite
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.annotation:annotation:1.8.0'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // AI 模型调用：OkHttp 自带后台线程池与超时控制，请求/解析都用 org.json，不再引 Gson
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
